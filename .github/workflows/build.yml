name: Build Jarvis APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/mankajithakor14/jarvis
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "JarvisAI"
          include ":app"
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.mankajithakor14.jarvis'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.mankajithakor14.jarvis'
                  minSdk 24
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <application
                  android:theme="@style/AppTheme"
                  android:label="Jarvis AI">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:gravity="center"
              android:padding="24dp">

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="JARVIS AI"
                  android:textSize="32sp"
                  android:textStyle="bold"/>

              <TextView
                  android:id="@+id/status"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="20dp"
                  android:text="Ready"
                  android:textSize="18sp"/>

              <Button
                  android:id="@+id/speakButton"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="20dp"
                  android:text="Speak to Jarvis"/>
          </LinearLayout>
          EOF

          cat > app/src/main/java/com/mankajithakor14/jarvis/MainActivity.java <<'EOF'
          package com.mankajithakor14.jarvis;

          import android.Manifest;
          import android.app.Activity;
          import android.os.Bundle;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.speech.RecognizerIntent;
          import android.widget.Button;
          import android.widget.TextView;
          import java.util.ArrayList;

          public class MainActivity extends Activity {
              TextView status;
              static final int VOICE = 10;

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  setContentView(R.layout.activity_main);

                  status = findViewById(R.id.status);
                  Button button = findViewById(R.id.speakButton);

                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO)
                          != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(
                          new String[]{Manifest.permission.RECORD_AUDIO}, 20);
                  }

                  button.setOnClickListener(v -> {
                      Intent i = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
                      i.putExtra(RecognizerIntent.EXTRA_LANGUAGE, "gu-IN");
                      i.putExtra(RecognizerIntent.EXTRA_PROMPT, "Jarvis ને કહો...");
                      startActivityForResult(i, VOICE);
                  });
              }

              @Override
              protected void onActivityResult(int r, int c, Intent d) {
                  super.onActivityResult(r, c, d);
                  if (r == VOICE && c == RESULT_OK && d != null) {
                      ArrayList<String> x =
                          d.getStringArrayListExtra(RecognizerIntent.EXTRA_RESULTS);
                      if (x != null && !x.isEmpty()) {
                          status.setText(x.get(0));
                      }
                  }
              }
          }
          EOF

      - name: Build APK
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-AI
          path: app/build/outputs/apk/debug/app-debug.apk
