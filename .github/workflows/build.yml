name: Build Jarvis APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Android project
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/mankajithakor14/jarvis
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "Jarvis"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.mankajithakor14.jarvis'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.mankajithakor14.jarvis'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Jarvis AI</string>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/mankajithakor14/jarvis/MainActivity.java <<'EOF'
          package com.mankajithakor14.jarvis;

          import android.app.Activity;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.content.Intent;
          import android.speech.RecognizerIntent;
          import android.speech.tts.TextToSpeech;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.view.View;
          import android.graphics.Color;

          import org.json.JSONObject;

          import java.io.BufferedReader;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.nio.charset.StandardCharsets;
          import java.util.ArrayList;
          import java.util.Locale;

          public class MainActivity extends Activity {

              private static final int VOICE_REQUEST = 1001;

              private TextView statusText;
              private TextView commandText;
              private TextToSpeech tts;

              private final Handler mainHandler =
                      new Handler(Looper.getMainLooper());

              private static final String API_URL =
                      "https://jarvis-ai-816k.vercel.app/api";

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  LinearLayout layout =
                          new LinearLayout(this);

                  layout.setOrientation(
                          LinearLayout.VERTICAL
                  );

                  layout.setPadding(
                          40, 60, 40, 40
                  );

                  TextView title =
                          new TextView(this);

                  title.setText("JARVIS AI");
                  title.setTextSize(30);
                  title.setTextColor(Color.BLACK);

                  layout.addView(title);

                  statusText =
                          new TextView(this);

                  statusText.setText(
                          "Jarvis તૈયાર છે."
                  );

                  statusText.setTextSize(20);

                  layout.addView(statusText);

                  commandText =
                          new TextView(this);

                  commandText.setText(
                          "તમારો અવાજ સાંભળવા માટે બટન દબાવો."
                  );

                  commandText.setTextSize(18);

                  layout.addView(commandText);

                  Button speakButton =
                          new Button(this);

                  speakButton.setText(
                          "🎙 Speak to Jarvis"
                  );

                  layout.addView(speakButton);

                  setContentView(layout);

                  tts =
                          new TextToSpeech(
                                  this,
                                  result -> {

                                      if (result ==
                                              TextToSpeech.SUCCESS) {

                                          tts.setLanguage(
                                              new Locale(
                                                  "gu",
                                                  "IN"
                                              )
                                          );
                                      }
                                  }
                          );

                  speakButton.setOnClickListener(
                          v -> startVoiceRecognition()
                  );
              }

              private void startVoiceRecognition() {

                  Intent intent =
                          new Intent(
                              RecognizerIntent.ACTION_RECOGNIZE_SPEECH
                          );

                  intent.putExtra(
                      RecognizerIntent.EXTRA_LANGUAGE_MODEL,
                      RecognizerIntent.LANGUAGE_MODEL_FREE_FORM
                  );

                  intent.putExtra(
                      RecognizerIntent.EXTRA_LANGUAGE,
                      "gu-IN"
                  );

                  intent.putExtra(
                      RecognizerIntent.EXTRA_PROMPT,
                      "Jarvis ને કહો..."
                  );

                  try {

                      startActivityForResult(
                          intent,
                          VOICE_REQUEST
                      );

                  } catch (Exception e) {

                      speak(
                          "Voice recognition ચાલુ થઈ શક્યું નથી."
                      );
                  }
              }

              @Override
              protected void onActivityResult(
                      int requestCode,
                      int resultCode,
                      Intent data) {

                  super.onActivityResult(
                          requestCode,
                          resultCode,
                          data
                  );

                  if (requestCode ==
                          VOICE_REQUEST &&
                      resultCode ==
                          RESULT_OK &&
                      data != null) {

                      ArrayList<String> results =
                              data.getStringArrayListExtra(
                                  RecognizerIntent.EXTRA_RESULTS
                              );

                      if (results != null &&
                          !results.isEmpty()) {

                          String command =
                                  results.get(0
