name: Build Jarvis APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Android project
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/mankajithakor14/jarvis
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "JarvisAI"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.mankajithakor14.jarvis'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.mankajithakor14.jarvis'
                  minSdk 24
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.INTERNET"/>

              <application
                  android:theme="@style/AppTheme"
                  android:label="Jarvis AI"
                  android:allowBackup="true"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>

              <style name="AppTheme"
                  parent="@android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">true</item>

              </style>

          </resources>
          EOF

          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <LinearLayout
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:gravity="center"
              android:padding="24dp">

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="JARVIS AI"
                  android:textSize="32sp"
                  android:textStyle="bold"/>

              <TextView
                  android:id="@+id/status"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="20dp"
                  android:text="Jarvis તૈયાર છે"
                  android:textSize="18sp"/>

              <Button
                  android:id="@+id/speakButton"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="20dp"
                  android:text="Speak to Jarvis"/>

          </LinearLayout>
          EOF

          cat > app/src/main/java/com/mankajithakor14/jarvis/MainActivity.java <<'EOF'
          package com.mankajithakor14.jarvis;

          import android.Manifest;
          import android.app.Activity;
          import android.os.Bundle;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.speech.RecognizerIntent;
          import android.speech.tts.TextToSpeech;
          import android.widget.Button;
          import android.widget.TextView;

          import java.util.ArrayList;
          import java.util.Locale;

          public class MainActivity extends Activity {

              private TextView status;
              private TextToSpeech tts;

              private static final int VOICE = 10;
              private static final int RECORD_AUDIO = 20;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  setContentView(R.layout.activity_main);

                  status = findViewById(R.id.status);
                  Button button = findViewById(R.id.speakButton);

                  tts = new TextToSpeech(this, result -> {

                      if (result == TextToSpeech.SUCCESS) {

                          int languageResult =
                                  tts.setLanguage(new Locale("gu", "IN"));

                          if (languageResult ==
                                  TextToSpeech.LANG_MISSING_DATA ||
                              languageResult ==
                                  TextToSpeech.LANG_NOT_SUPPORTED) {

                              status.setText(
                                  "Gujarati voice available નથી"
                              );
                          }
                      }
                  });

                  if (checkSelfPermission(
                          Manifest.permission.RECORD_AUDIO)
                          != PackageManager.PERMISSION_GRANTED) {

                      requestPermissions(
                          new String[]{
                              Manifest.permission.RECORD_AUDIO
                          },
                          RECORD_AUDIO
                      );
                  }

                  button.setOnClickListener(v -> listen());
              }

              private void listen() {

                  Intent intent =
                          new Intent(
                              RecognizerIntent.ACTION_RECOGNIZE_SPEECH
                          );

                  intent.putExtra(
                      RecognizerIntent.EXTRA_LANGUAGE,
                      "gu-IN"
                  );

                  intent.putExtra(
                      RecognizerIntent.EXTRA_LANGUAGE_MODEL,
                      RecognizerIntent.LANGUAGE_MODEL_FREE_FORM
                  );

                  intent.putExtra(
                      RecognizerIntent.EXTRA_PROMPT,
                      "Jarvis ને કહો..."
                  );

                  try {
                      startActivityForResult(intent, VOICE);
                  } catch (Exception e) {
                      status.setText(
                          "Voice recognition available નથી"
                      );
                  }
              }

              private void speak(String message) {

                  status.setText(message);

                  if (tts != null) {

                      tts.speak(
                          message,
                          TextToSpeech.QUEUE_FLUSH,
                          null,
                          "jarvis"
                      );
                  }
              }

              private String reply(String command) {

                  String x =
                      command.toLowerCase(Locale.ROOT);

                  if (x.contains("હેલો") ||
                      x.contains("હાય") ||
                      x.contains("hello") ||
                      x.contains("hi")) {

                      return "નમસ્તે. હું Jarvis છું. હું તમારી મદદ માટે તૈયાર છું.";
                  }

                  if (x.contains("કેમ છો") ||
                      x.contains("how are you")) {

                      return "હું બરાબર છું. તમે કહો, શું કરવું છે?";
                  }

                  if (x.contains("તમારું નામ") ||
                      x.contains("નામ શું")) {

                      return "મારું નામ Jarvis છે.";
                  }

                  return "મેં તમારું કહ્યું સાંભળ્યું: " + command;
              }

              @Override
              protected void onActivityResult(
                      int requestCode,
                      int resultCode,
                      Intent data) {

                  super.onActivityResult(
                      requestCode,
                      resultCode,
                      data
                  );

                  if (requestCode == VOICE &&
                      resultCode == RESULT_OK &&
                      data != null) {

                      ArrayList<String> results =
                          data.getStringArrayListExtra(
                              RecognizerIntent.EXTRA_RESULTS
                          );

                      if (results != null &&
                          !results.isEmpty()) {

                          speak(reply(results.get(0)));
                      }
                  }
              }

              @Override
              protected void onDestroy() {

                  if (tts != null) {
                      tts.stop();
                      tts.shutdown();
                  }

                  super.onDestroy();
              }
          }
          EOF

      - name: Build APK
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-AI
          path: app/build/outputs/apk/debug/app-debug.apk
